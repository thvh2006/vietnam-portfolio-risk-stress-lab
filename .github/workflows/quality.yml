name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/run_risk.py
      - run: python3 scripts/build_dashboard_snapshot.py --check
      - run: python3 scripts/run_checks.py
      - run: python3 -m unittest discover -s tests -v
